# 매일(평일 17:00 KST = 08:00 UTC) 데이터 수집 + 대시보드 렌더 + 커밋.
# 커밋이 생기면 pages.yml 이 사이트를 갱신한다. 실행이 실패해도 전날 화면은 그대로 남고,
# 다음 실행이 최근 7일 리포트를 백필한다. (브리핑 글 LLM 단계는 후속: run_daily.py)
name: daily-brief
on:
  schedule:
    - cron: "0 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect (KR market · 한경 컨센서스 7일 백필 · US)
        run: |
          python -m src.dashboard_pipeline --collect --force || echo "::warning::KR 스냅샷 실패"
          python -m src.data.archive ingest || echo "::warning::아카이브 실패"
          python -m src.data.us_analyst || echo "::warning::US 수집 실패"
      - name: Render dashboard + snapshot
        run: python -m src.dashboard_pipeline --render
      - name: Commit results
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no changes" || git commit -m "daily: $(date +%F) 수집·렌더 [skip ci]" && git push
      - name: Trigger pages deploy
        run: gh workflow run publish-dashboard
        env:
          GH_TOKEN: ${{ github.token }}
